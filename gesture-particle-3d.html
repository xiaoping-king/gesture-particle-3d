<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>3D手势粒子特效</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            color: white;
            touch-action: none;
        }

        /* 磨砂玻璃通用样式 */
        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        #canvas3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #videoElement {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 100px;
            height: 133px; /* 4:3 比例 */
            border-radius: 16px;
            object-fit: cover;
            z-index: 10;
            transform: scaleX(-1);
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        
        #videoElement:hover {
            opacity: 1;
        }

        /* 加载动画优化 */
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f0f1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease;
        }

        .loader-circle {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00f2ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .loading-text {
            font-size: 16px;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
        }

        /* 启动按钮优化 */
        #startButton {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 18px 40px;
            font-size: 18px;
            font-weight: 500;
            color: white;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            z-index: 101;
            box-shadow: 0 10px 40px rgba(0, 114, 255, 0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 1px;
        }

        #startButton:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        /* 操作说明优化 */
        #gestureGuide {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 20px;
            border-radius: 24px;
            z-index: 10;
            transition: all 0.4s ease;
            max-width: 92%;
            overflow-x: auto;
            white-space: nowrap;
            /* 隐藏滚动条但保留功能 */
            scrollbar-width: none; 
            -ms-overflow-style: none; 
        }
        
        #gestureGuide::-webkit-scrollbar { display: none; }

        .gesture-items {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .gesture-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        
        .gesture-item:hover, .gesture-item.active {
            opacity: 1;
            transform: translateY(-2px);
        }

        .gesture-icon {
            font-size: 24px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .gesture-text {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* 状态指示器 */
        #statusIndicator {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            color: rgba(255,255,255,0.9);
            z-index: 9;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00f2ff;
            box-shadow: 0 0 10px #00f2ff;
        }

        /* FPS计数器优化 */
        #fpsCounter {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-family: 'Monaco', monospace;
            color: rgba(255,255,255,0.6);
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas3d"></canvas>
        <video id="videoElement" class="glass" autoplay playsinline></video>

        <div id="loadingScreen">
            <div class="loader-circle"></div>
            <div class="loading-text">INITIALIZING</div>
        </div>

        <button id="startButton">✨ 开启粒子世界</button>

        <div id="statusIndicator" class="glass">
            <div class="status-dot"></div>
            <span id="statusText">Ready</span>
        </div>

        <!-- 手势操作说明 -->
        <div id="gestureGuide" class="glass">
            <div class="gesture-items">
                <div class="gesture-item">
                    <div class="gesture-icon">1️⃣-5️⃣</div>
                    <div class="gesture-text">数字变换</div>
                </div>
                <div class="gesture-item">
                    <div class="gesture-icon">✊</div>
                    <div class="gesture-text">引力聚集</div>
                </div>
                <div class="gesture-item">
                    <div class="gesture-icon">✋</div>
                    <div class="gesture-text">能量爆发</div>
                </div>
                <div class="gesture-item">
                    <div class="gesture-icon">☝️</div>
                    <div class="gesture-text">流体跟随</div>
                </div>
            </div>
        </div>

        <div id="fpsCounter" class="glass">FPS: 60</div>
        
        <!-- 错误提示 & 权限引导 保持原有结构但样式会自动应用 global -->
        <div id="permissionGuide" class="hidden glass" style="/*原有内联样式需移动到CSS*/ position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 30px; border-radius: 20px; text-align: center; max-width: 300px; z-index: 102;">
            <div class="permission-icon">📷</div>
            <div class="permission-title" style="margin: 15px 0;">启用摄像头</div>
            <div class="permission-desc" style="font-size: 14px; opacity: 0.8; margin-bottom: 20px;">体验手势交互需要访问摄像头权限</div>
            <button class="permission-btn" onclick="requestCameraPermission()" style="background: #0072ff; border: none; padding: 10px 25px; border-radius: 20px; color: white;">允许访问</button>
        </div>
    </div>

    <!-- CDN引入 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <script>
        // ==================== 全局配置 ====================
        const CONFIG = {
            // 粒子系统配置（iPhone 13 专属优化）
            particles: {
                maxCount: /iPhone|iPad|iPod/.test(navigator.userAgent) ? 1000 : 1500, // iPhone 13 跑 1000 个粒子毫无压力
                minCount: 600,
                defaultSize: 0.02,
                glowIntensity: 2.2, 
                attractionForce: 0.08,
                damping: 0.94,
                colorPalette: [
                    new THREE.Color(0x00f2ff), 
                    new THREE.Color(0xbc13fe), 
                    new THREE.Color(0xff0055), 
                    new THREE.Color(0x00ff9d), 
                    new THREE.Color(0xffae00), 
                ]
            },
            // 手势识别阈值
            gesture: {
                fistThreshold: 0.15,
                openHandThreshold: 0.25,
                pinchThreshold: 0.05,
                swipeSpeedThreshold: 0.3,
                movementSmoothness: 0.3,    
                skipFrames: 3               // 默认跳帧，后续动态调整
            },
            iOS: {
                videoWidth: 320,  
                videoHeight: 240,
                facingMode: 'user'
            }
        };

        // ==================== 全局变量 ====================
        let scene, camera, renderer, particleSystem;
        let hands, cameraStream;
        let currentGesture = null;
        let lastHandPosition = { x: 0, y: 0, z: 0 };
        let handVelocity = { x: 0, y: 0 };
        let particleMode = 'sphere'; // sphere, flat, star, spiral
        let isGripping = false;
        let isPinching = false;
        let lastPinchDistance = 0;
        let trailParticles = [];
        let swipeHistory = [];
        let particleCount = CONFIG.particles.maxCount;
        let guideVisible = true;

        // FPS监控
        let fps = 60;
        let lastFrameTime = performance.now();
        let frameCount = 0;
        let gestureFrameCount = 0; // 手势检测帧计数器

        // ==================== 初始化入口 ====================
        document.getElementById('startButton').addEventListener('click', async () => {
            document.getElementById('startButton').classList.add('hidden');
            await initializeApp();
        });

        async function initializeApp() {
            try {
                // 显示加载动画
                showLoading(true);

                // 初始化Three.js场景
                await initThreeJS();

                // 请求摄像头权限并初始化MediaPipe
                await initCamera();
                await initMediaPipe();

                // 隐藏加载动画
                setTimeout(() => {
                    showLoading(false);
                }, 1500);

            } catch (error) {
                console.error('初始化失败:', error);
                showError('初始化失败', error.message);
            }
        }

        // ==================== Three.js 场景初始化 ====================
        async function initThreeJS() {
            const container = document.getElementById('canvas3d');

            // 场景
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0a0a0a, 0.002);

            // 相机
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.z = 2;

            // 渲染器
            renderer = new THREE.WebGLRenderer({
                canvas: container,
                antialias: true,
                alpha: true,
                powerPreference: "high-performance"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(1); // iOS优化：固定像素比为1

            // 创建粒子系统
            createParticleSystem();

            // 添加背景星光
            createBackgroundStars();

            // 添加环境光
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);

            // 点光源（跟随粒子群）
            const pointLight = new THREE.PointLight(0x4a90e2, 2, 10);
            pointLight.position.set(0, 0, 1);
            scene.add(pointLight);

            // 窗口自适应
            window.addEventListener('resize', onWindowResize);

            // 启动渲染循环
            animate();
        }

        // 创建粒子系统
        function createParticleSystem() {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            const velocities = new Float32Array(particleCount * 3);

            // 初始化粒子位置（球体分布）
            for (let i = 0; i < particleCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(Math.random() * 2 - 1);
                const radius = 0.5 + Math.random() * 0.3;

                positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = radius * Math.cos(phi);

                // 初始颜色（蓝色系）
                const color = CONFIG.particles.colorPalette[0];
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;

                // 粒子大小（带随机性）
                sizes[i] = CONFIG.particles.defaultSize * (0.8 + Math.random() * 0.4);

                // 初始速度
                velocities[i * 3] = (Math.random() - 0.5) * 0.01;
                velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.01;
                velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.01;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            // 自定义shader材质（流光发光效果）
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    glowIntensity: { value: CONFIG.particles.glowIntensity },
                    uTime: { value: 0 },
                    uColor: { value: new THREE.Color(CONFIG.particles.colorPalette[0]) }
                },
                vertexShader: `
                    attribute float size;
                    attribute vec3 color;
                    varying vec3 vColor;
                    varying float vAlpha;
                    uniform float uTime;
                    
                    void main() {
                        vColor = color;
                        
                        // 呼吸效果
                        float breath = sin(uTime * 2.0 + position.x * 2.0) * 0.2 + 1.0;
                        
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        
                        // 距离衰减
                        float distanceScale = 300.0 / -mvPosition.z;
                        gl_PointSize = size * distanceScale * breath;
                        
                        // 边缘淡出
                        vAlpha = smoothstep(5.0, 0.0, -mvPosition.z);
                        
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform float glowIntensity;
                    varying vec3 vColor;
                    varying float vAlpha;
                    
                    void main() {
                        // 软粒子纹理
                        float dist = length(gl_PointCoord - vec2(0.5));
                        if (dist > 0.5) discard;
                        
                        // 辉光核心
                        float strength = 0.05 / (dist * dist + 0.001);
                        strength = clamp(strength, 0.0, 1.0);
                        
                        float alpha = (1.0 - dist * 2.0) * vAlpha;
                        vec3 finalColor = vColor * glowIntensity * strength;
                        
                        gl_FragColor = vec4(finalColor, alpha * 0.8);
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particleSystem = new THREE.Points(geometry, material);
            particleSystem.userData.velocities = velocities;
            scene.add(particleSystem);
        }

        // 创建背景星光
        function createBackgroundStars() {
            const starGeometry = new THREE.BufferGeometry();
            const starPositions = new Float32Array(200 * 3);
            
            for (let i = 0; i < 200; i++) {
                starPositions[i * 3] = (Math.random() - 0.5) * 20;
                starPositions[i * 3 + 1] = (Math.random() - 0.5) * 20;
                starPositions[i * 3 + 2] = (Math.random() - 0.5) * 20;
            }

            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            
            const starMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.02,
                transparent: true,
                opacity: 0.3
            });

            const stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);
        }

        // ==================== 摄像头初始化 ====================
        async function initCamera() {
            const videoElement = document.getElementById('videoElement');

            try {
                const constraints = {
                    video: {
                        width: { ideal: CONFIG.iOS.videoWidth },
                        height: { ideal: CONFIG.iOS.videoHeight },
                        facingMode: CONFIG.iOS.facingMode
                    },
                    audio: false
                };

                cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = cameraStream;

                // iOS需要用户交互后才能播放视频
                await videoElement.play();

            } catch (error) {
                console.error('摄像头启动失败:', error);
                if (error.name === 'NotAllowedError') {
                    showPermissionGuide();
                } else {
                    throw new Error('无法访问摄像头，请确保设备有摄像头并授予权限');
                }
            }
        }

        async function requestCameraPermission() {
            document.getElementById('permissionGuide').classList.add('hidden');
            await initCamera();
            await initMediaPipe();
        }

        // ==================== MediaPipe 手势识别 ====================
        async function initMediaPipe() {
            const videoElement = document.getElementById('videoElement');

            hands = new Hands({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                }
            });

            hands.setOptions({
                maxNumHands: 1,  // 只检测一只手提升性能
                modelComplexity: 0,  // 降低模型复杂度
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            hands.onResults(onHandsResults);

            // 启动摄像头处理
            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: CONFIG.iOS.videoWidth,
                height: CONFIG.iOS.videoHeight
            });

            camera.start();
        }

        // ==================== 手势识别回调 ====================
        function onHandsResults(results) {
            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                currentGesture = null;
                return;
            }

            // 跳帧优化：每N帧处理一次手势识别
            gestureFrameCount++;
            if (gestureFrameCount % (CONFIG.gesture.skipFrames + 1) !== 0) {
                // 即便跳帧，也要平滑移动粒子
                if (currentGesture?.type === 'number') {
                    morphToNumber(currentGesture.data.number);
                }
                return;
            }

            const landmarks = results.multiHandLandmarks[0]; // 使用第一只手
            const handedness = results.multiHandedness[0].label; // Left or Right

            // 识别手势类型
            const gesture = recognizeGesture(landmarks);
            currentGesture = gesture;

            // 计算手掌中心位置（用于粒子跟随）
            const handCenter = calculateHandCenter(landmarks);
            
            // 转换到3D空间坐标（归一化到 -1 到 1）
            const handPos3D = {
                x: (handCenter.x - 0.5) * 2,
                y: -(handCenter.y - 0.5) * 2,
                z: handCenter.z * 2
            };

            // 计算手部移动速度
            handVelocity = {
                x: (handPos3D.x - lastHandPosition.x) * 0.1,
                y: (handPos3D.y - lastHandPosition.y) * 0.1
            };

            // 平滑移动
            lastHandPosition.x += (handPos3D.x - lastHandPosition.x) * CONFIG.gesture.movementSmoothness;
            lastHandPosition.y += (handPos3D.y - lastHandPosition.y) * CONFIG.gesture.movementSmoothness;
            lastHandPosition.z += (handPos3D.z - lastHandPosition.z) * CONFIG.gesture.movementSmoothness;

            // 根据手势更新粒子
            updateParticlesByGesture(gesture, landmarks, lastHandPosition);
        }

        // 识别手势
        function recognizeGesture(landmarks) {
            // 计算手指伸展度
            const fingerExtensions = calculateFingerExtensions(landmarks);
            
            // 数字手势检测（1-5）- 优先级最高
            const numberGesture = detectNumberGesture(fingerExtensions);
            if (numberGesture) {
                return { type: 'number', data: { number: numberGesture } };
            }
            
            // 握拳检测（所有手指都收起）
            if (fingerExtensions.every(ext => ext < CONFIG.gesture.fistThreshold)) {
                isGripping = true;
                return { type: 'fist', data: null };
            }

            // 张开手掌检测
            if (fingerExtensions.every(ext => ext > CONFIG.gesture.openHandThreshold)) {
                if (isGripping) {
                    isGripping = false;
                    return { type: 'release', data: null };
                }
                return { type: 'open', data: null };
            }

            // 捏合检测（拇指+食指）
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const pinchDistance = Math.sqrt(
                Math.pow(thumbTip.x - indexTip.x, 2) +
                Math.pow(thumbTip.y - indexTip.y, 2)
            );

            if (pinchDistance < CONFIG.gesture.pinchThreshold) {
                isPinching = true;
                return { type: 'pinch', data: { distance: pinchDistance } };
            } else if (isPinching && pinchDistance > CONFIG.gesture.pinchThreshold * 2) {
                isPinching = false;
            }

            // 单指指向检测（仅食指伸出）
            if (fingerExtensions[1] > 0.25 && 
                fingerExtensions[2] < 0.15 && 
                fingerExtensions[3] < 0.15 && 
                fingerExtensions[4] < 0.15) {
                return { type: 'point', data: { tip: landmarks[8] } };
            }

            // 挥手检测（基于速度）
            const speed = Math.sqrt(handVelocity.x ** 2 + handVelocity.y ** 2);
            swipeHistory.push(speed);
            if (swipeHistory.length > 10) swipeHistory.shift();

            const avgSpeed = swipeHistory.reduce((a, b) => a + b, 0) / swipeHistory.length;
            if (avgSpeed > CONFIG.gesture.swipeSpeedThreshold) {
                return { type: 'swipe', data: { speed: avgSpeed } };
            }

            return { type: 'idle', data: null };
        }

        // 检测数字手势（1-5）优化版
        function detectNumberGesture(fingerExtensions) {
            // fingerExtensions: [拇指, 食指, 中指, 无名指, 小指]
            const threshold = 0.25; // 稍微提高阈值，避免误触
            const extended = fingerExtensions.map(ext => ext > threshold);
            
            // 拇指判断比较特殊，有时会误判
            const thumbExtended = fingerExtensions[0] > 0.3; // 拇指需要伸得更直
            
            // 数字1：仅食指
            if (!thumbExtended && extended[1] && !extended[2] && !extended[3] && !extended[4]) return 1;
            
            // 数字2：食指+中指
            if (!thumbExtended && extended[1] && extended[2] && !extended[3] && !extended[4]) return 2;
            
            // 数字3：食指+中指+无名指
            if (!thumbExtended && extended[1] && extended[2] && extended[3] && !extended[4]) return 3;
            
            // 数字4：四指
            if (!thumbExtended && extended[1] && extended[2] && extended[3] && extended[4]) return 4;
            
            // 数字5：五指
            if (thumbExtended && extended[1] && extended[2] && extended[3] && extended[4]) return 5;
            
            return null;
        }

        // 计算手指伸展度
        function calculateFingerExtensions(landmarks) {
            const fingerTips = [4, 8, 12, 16, 20]; // 拇指, 食指, 中指, 无名指, 小指
            const fingerBases = [2, 5, 9, 13, 17];
            const extensions = [];

            for (let i = 0; i < fingerTips.length; i++) {
                const tip = landmarks[fingerTips[i]];
                const base = landmarks[fingerBases[i]];
                const distance = Math.sqrt(
                    Math.pow(tip.x - base.x, 2) +
                    Math.pow(tip.y - base.y, 2)
                );
                extensions.push(distance);
            }

            return extensions;
        }

        // 计算手掌中心
        function calculateHandCenter(landmarks) {
            let sumX = 0, sumY = 0, sumZ = 0;
            landmarks.forEach(lm => {
                sumX += lm.x;
                sumY += lm.y;
                sumZ += lm.z;
            });
            return {
                x: sumX / landmarks.length,
                y: sumY / landmarks.length,
                z: sumZ / landmarks.length
            };
        }

        // ==================== 粒子更新逻辑 ====================
        function updateParticlesByGesture(gesture, landmarks, handPos) {
            if (!particleSystem) return;

            const positions = particleSystem.geometry.attributes.position.array;
            const colors = particleSystem.geometry.attributes.color.array;
            const sizes = particleSystem.geometry.attributes.size.array;
            const velocities = particleSystem.userData.velocities;

            switch (gesture?.type) {
                case 'fist':
                    // 握拳：粒子聚集到拳头位置
                    for (let i = 0; i < particleCount; i++) {
                        const idx = i * 3;
                        const dx = handPos.x - positions[idx];
                        const dy = handPos.y - positions[idx + 1];
                        const dz = handPos.z - positions[idx + 2];
                        
                        velocities[idx] += dx * CONFIG.particles.attractionForce * 2;
                        velocities[idx + 1] += dy * CONFIG.particles.attractionForce * 2;
                        velocities[idx + 2] += dz * CONFIG.particles.attractionForce * 2;

                        // 增强亮度
                        colors[idx] = Math.min(1, colors[idx] * 1.05);
                        colors[idx + 1] = Math.min(1, colors[idx + 1] * 1.05);
                        colors[idx + 2] = Math.min(1, colors[idx + 2] * 1.05);

                        sizes[i] = Math.min(0.03, sizes[i] * 1.02);
                    }
                    break;

                case 'release':
                    // 张开释放：粒子爆炸散开
                    for (let i = 0; i < particleCount; i++) {
                        const idx = i * 3;
                        const angle = Math.random() * Math.PI * 2;
                        const speed = 0.05 + Math.random() * 0.1;
                        
                        velocities[idx] = Math.cos(angle) * speed;
                        velocities[idx + 1] = Math.sin(angle) * speed;
                        velocities[idx + 2] = (Math.random() - 0.5) * speed;

                        // 彩虹色
                        const rainbowColor = CONFIG.particles.colorPalette[i % CONFIG.particles.colorPalette.length];
                        colors[idx] = rainbowColor.r;
                        colors[idx + 1] = rainbowColor.g;
                        colors[idx + 2] = rainbowColor.b;
                    }
                    break;

                case 'pinch':
                    // 捏合：缩放粒子群
                    const scale = 1 - gesture.data.distance * 5;
                    for (let i = 0; i < particleCount; i++) {
                        const idx = i * 3;
                        positions[idx] *= scale;
                        positions[idx + 1] *= scale;
                        positions[idx + 2] *= scale;

                        // 压缩发光
                        sizes[i] = CONFIG.particles.defaultSize * (1 + (1 - scale) * 2);
                    }
                    break;

                case 'point':
                    // 单指轨迹：生成跟随粒子流
                    const tipPos = {
                        x: (gesture.data.tip.x - 0.5) * 2,
                        y: -(gesture.data.tip.y - 0.5) * 2,
                        z: gesture.data.tip.z * 2
                    };

                    // 添加轨迹粒子
                    if (trailParticles.length < CONFIG.particles.trailLength) {
                        trailParticles.push({ ...tipPos, life: 1.0 });
                    }

                    // 核心粒子群缓慢靠拢
                    for (let i = 0; i < particleCount; i++) {
                        const idx = i * 3;
                        const dx = tipPos.x - positions[idx];
                        const dy = tipPos.y - positions[idx + 1];
                        
                        velocities[idx] += dx * CONFIG.particles.attractionForce * 0.5;
                        velocities[idx + 1] += dy * CONFIG.particles.attractionForce * 0.5;

                        // 速度影响颜色
                        const speed = Math.sqrt(handVelocity.x ** 2 + handVelocity.y ** 2);
                        colors[idx] = speed * 10;
                        colors[idx + 1] = 0.5;
                        colors[idx + 2] = 1 - speed * 5;
                    }
                    break;

                case 'swipe':
                    // 挥手：切换粒子形态
                    switchParticleMode();
                    break;

                case 'number':
                    // 数字手势：显示对应数字形状
                    morphToNumber(gesture.data.number);
                    break;
            }

            // 更新缓冲区
            particleSystem.geometry.attributes.position.needsUpdate = true;
            particleSystem.geometry.attributes.color.needsUpdate = true;
            particleSystem.geometry.attributes.size.needsUpdate = true;
        }

        // 变形为数字形状（弹性平滑过渡）
        let lastNumberTime = 0;
        let cachedNumberShapes = {};
        let currentTargetNumber = null;
        
        function morphToNumber(number) {
            const now = Date.now();
            if (now - lastNumberTime < 300 && currentTargetNumber === number) return; 
            lastNumberTime = now;
            currentTargetNumber = number;

            const positions = particleSystem.geometry.attributes.position.array;
            const colors = particleSystem.geometry.attributes.color.array;
            
            if (!cachedNumberShapes[number]) {
                cachedNumberShapes[number] = generateNumberShape(number);
            }
            const numberPositions = cachedNumberShapes[number];
            
            // 增加一点随机性，避免看起来太呆板
            const time = now / 1000;
            
            for (let i = 0; i < particleCount; i++) {
                const idx = i * 3;
                const targetIdx = i % numberPositions.length;
                const target = numberPositions[targetIdx];
                
                // 弹性Lerp：先快后慢
                const lerpFactor = 0.08;
                
                // 目标位置加入微小的正弦浮动
                const floatX = Math.sin(time + i * 0.1) * 0.02;
                const floatY = Math.cos(time + i * 0.1) * 0.02;
                
                positions[idx] += (target.x + floatX - positions[idx]) * lerpFactor;
                positions[idx + 1] += (target.y + floatY - positions[idx + 1]) * lerpFactor;
                positions[idx + 2] += (target.z - positions[idx + 2]) * lerpFactor;

                // 颜色渐变
                const colorIndex = Math.floor((number - 1) % CONFIG.particles.colorPalette.length);
                const targetColor = CONFIG.particles.colorPalette[colorIndex];
                
                colors[idx] += (targetColor.r - colors[idx]) * 0.05;
                colors[idx + 1] += (targetColor.g - colors[idx + 1]) * 0.05;
                colors[idx + 2] += (targetColor.b - colors[idx + 2]) * 0.05;
            }
        }

        // 生成数字形状的粒子位置
        function generateNumberShape(number) {
            const positions = [];
            const scale = 0.8;
            const thickness = 0.08;
            
            switch(number) {
                case 1:
                    // 数字1：竖线（减少点数）
                    for (let y = -1; y <= 1; y += 0.06) {
                        positions.push({ x: 0, y: y * scale, z: 0 });
                    }
                    // 顶部斜线
                    for (let i = 0; i < 10; i++) {
                        const t = i / 10;
                        positions.push({ x: -0.2 * t * scale, y: (1 - 0.3 * t) * scale, z: 0 });
                    }
                    break;
                    
                case 2:
                    // 数字2：上弧+斜线+底线（减少点数）
                    // 上弧
                    for (let angle = Math.PI; angle <= Math.PI * 2; angle += 0.1) {
                        const x = Math.cos(angle) * 0.4;
                        const y = Math.sin(angle) * 0.4 + 0.6;
                        positions.push({ x: x * scale, y: y * scale, z: 0 });
                    }
                    // 斜线
                    for (let i = 0; i < 20; i++) {
                        const t = i / 20;
                        positions.push({ x: (0.4 - 0.8 * t) * scale, y: (0.2 - 1.2 * t) * scale, z: 0 });
                    }
                    // 底线
                    for (let x = -0.4; x <= 0.4; x += 0.06) {
                        positions.push({ x: x * scale, y: -1 * scale, z: 0 });
                    }
                    break;
                    
                case 3:
                    // 数字3：上弧+中弧+下弧（减少点数）
                    // 上弧
                    for (let angle = -Math.PI/2; angle <= Math.PI/2; angle += 0.1) {
                        const x = Math.cos(angle) * 0.4;
                        const y = Math.sin(angle) * 0.4 + 0.5;
                        positions.push({ x: x * scale, y: y * scale, z: 0 });
                    }
                    // 中线
                    for (let x = -0.3; x <= 0.4; x += 0.07) {
                        positions.push({ x: x * scale, y: 0, z: 0 });
                    }
                    // 下弧
                    for (let angle = -Math.PI/2; angle <= Math.PI/2; angle += 0.1) {
                        const x = Math.cos(angle) * 0.4;
                        const y = Math.sin(angle) * 0.4 - 0.5;
                        positions.push({ x: x * scale, y: y * scale, z: 0 });
                    }
                    break;
                    
                case 4:
                    // 数字4：竖线+斜线+横线（减少点数）
                    // 左斜线
                    for (let i = 0; i < 20; i++) {
                        const t = i / 20;
                        positions.push({ x: (-0.4 + 0.4 * t) * scale, y: (1 - 1.5 * t) * scale, z: 0 });
                    }
                    // 横线
                    for (let x = -0.4; x <= 0.5; x += 0.07) {
                        positions.push({ x: x * scale, y: -0.2 * scale, z: 0 });
                    }
                    // 右竖线
                    for (let y = -1; y <= 1; y += 0.06) {
                        positions.push({ x: 0.3 * scale, y: y * scale, z: 0 });
                    }
                    break;
                    
                case 5:
                    // 数字5：横线+竖线+弧线+底线（减少点数）
                    // 顶部横线
                    for (let x = -0.4; x <= 0.4; x += 0.06) {
                        positions.push({ x: x * scale, y: 1 * scale, z: 0 });
                    }
                    // 左竖线
                    for (let y = 0.2; y <= 1; y += 0.06) {
                        positions.push({ x: -0.4 * scale, y: y * scale, z: 0 });
                    }
                    // 中间横线
                    for (let x = -0.4; x <= 0.3; x += 0.07) {
                        positions.push({ x: x * scale, y: 0.2 * scale, z: 0 });
                    }
                    // 下弧
                    for (let angle = -Math.PI/2; angle <= Math.PI/2; angle += 0.1) {
                        const x = Math.cos(angle) * 0.4;
                        const y = Math.sin(angle) * 0.5 - 0.3;
                        positions.push({ x: x * scale, y: y * scale, z: 0 });
                    }
                    break;
            }
            
            return positions;
        }

        // 切换粒子形态
        let lastSwipeTime = 0;
        function switchParticleMode() {
            const now = Date.now();
            if (now - lastSwipeTime < 1000) return; // 防止频繁切换
            lastSwipeTime = now;

            const modes = ['sphere', 'flat', 'star', 'spiral'];
            const currentIndex = modes.indexOf(particleMode);
            particleMode = modes[(currentIndex + 1) % modes.length];

            const positions = particleSystem.geometry.attributes.position.array;
            
            for (let i = 0; i < particleCount; i++) {
                const idx = i * 3;
                let x, y, z;

                switch (particleMode) {
                    case 'sphere':
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos(Math.random() * 2 - 1);
                        const radius = 0.5;
                        x = radius * Math.sin(phi) * Math.cos(theta);
                        y = radius * Math.sin(phi) * Math.sin(theta);
                        z = radius * Math.cos(phi);
                        break;

                    case 'flat':
                        x = (Math.random() - 0.5) * 2;
                        y = (Math.random() - 0.5) * 2;
                        z = (Math.random() - 0.5) * 0.1;
                        break;

                    case 'star':
                        const angle = (i / particleCount) * Math.PI * 2 * 5;
                        const r = 0.3 + (i % 2) * 0.3;
                        x = r * Math.cos(angle);
                        y = r * Math.sin(angle);
                        z = (Math.random() - 0.5) * 0.2;
                        break;

                    case 'spiral':
                        const t = i / particleCount * Math.PI * 4;
                        x = t * 0.2 * Math.cos(t);
                        y = t * 0.2 * Math.sin(t);
                        z = (i / particleCount - 0.5) * 2;
                        break;
                }

                // 平滑过渡
                positions[idx] += (x - positions[idx]) * 0.05;
                positions[idx + 1] += (y - positions[idx + 1]) * 0.05;
                positions[idx + 2] += (z - positions[idx + 2]) * 0.05;
            }
        }

        // 渲染循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 更新Shader时间
            if (particleSystem && particleSystem.material.uniforms) {
                particleSystem.material.uniforms.uTime.value = performance.now() / 1000;
            }

            // 更新粒子物理
            updateParticlePhysics();

            // 渲染场景
            renderer.render(scene, camera);

            // FPS监控
            updateFPS();
        }
        // 更新粒子物理（高性能优化版）
        function updateParticlePhysics() {
            if (!particleSystem) return;

            const positions = particleSystem.geometry.attributes.position.array;
            const velocities = particleSystem.userData.velocities;
            
            // 缓存配置，减少属性访问
            const damping = CONFIG.particles.damping;
            const count = 1000; // iPhone 13 60帧优化：固定粒子数为1000

            for (let i = 0; i < count; i++) {
                const idx = i * 3;
                
                // 1. 更新位置 (使用临时变量减少数组查找)
                let vx = velocities[idx];
                let vy = velocities[idx + 1];
                let vz = velocities[idx + 2];
                
                positions[idx] += vx;
                positions[idx + 1] += vy;
                positions[idx + 2] += vz;

                // 2. 应用阻尼和微重力
                vx *= damping;
                vy = vy * damping - 0.0003; // 微重力合并计算
                vz *= damping;
                
                // 3. 边界反弹 (简化计算)
                if (Math.abs(positions[idx]) > 3) vx *= -0.5;
                if (Math.abs(positions[idx + 1]) > 3) vy *= -0.5;
                if (Math.abs(positions[idx + 2]) > 3) vz *= -0.5;

                // 写回速度数组
                velocities[idx] = vx;
                velocities[idx + 1] = vy;
                velocities[idx + 2] = vz;
            }

            particleSystem.geometry.attributes.position.needsUpdate = true;
        }

        // ==================== UI 交互 ====================
        function toggleGuide() {
            guideVisible = !guideVisible;
            const guide = document.getElementById('gestureGuide');
            guide.classList.toggle('hidden', !guideVisible);
        }

        function showLoading(show) {
            const loading = document.getElementById('loadingScreen');
            if (show) {
                loading.classList.remove('hidden');
            } else {
                loading.classList.add('hidden');
            }
        }

        function showPermissionGuide() {
            document.getElementById('permissionGuide').classList.remove('hidden');
        }

        function showError(title, message) {
            const errorDiv = document.getElementById('errorMessage');
            const errorDesc = document.getElementById('errorDesc');
            errorDesc.textContent = message;
            errorDiv.classList.add('show');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateFPS() {
            frameCount++;
            const currentTime = performance.now();
            if (currentTime >= lastFrameTime + 1000) {
                fps = Math.round((frameCount * 1000) / (currentTime - lastFrameTime));
                frameCount = 0;
                lastFrameTime = currentTime;
                // document.getElementById('fpsCounter').textContent = `FPS: ${fps}`;
            }
        }

        // ==================== 错误处理 ====================
        window.addEventListener('error', (event) => {
            console.error('全局错误:', event.error);
            if (event.message.includes('CDN') || event.message.includes('network')) {
                showError('资源加载失败', '网络异常，请检查网络连接后刷新重试');
            }
        });

        // 性能监控（温和调整）
        setInterval(() => {
            if (fps < 25 && particleCount > CONFIG.particles.minCount) {
                particleCount = Math.max(CONFIG.particles.minCount, particleCount - 100);
                // console.log('⚡ 性能优化：降低粒子数至', particleCount);
            } else if (fps > 58 && particleCount < CONFIG.particles.maxCount) {
                particleCount = Math.min(CONFIG.particles.maxCount, particleCount + 50);
                // console.log('✨ 性能提升：增加粒子数至', particleCount);
            }
            
            // 动态调整跳帧策略
            if (fps < 45) {
                CONFIG.gesture.skipFrames = 5; // 掉帧时，优先保渲染
            } else if (fps >= 58) {
                CONFIG.gesture.skipFrames = 3; // 流畅时，提高识别率
            }
            
            // 更新状态指示灯
            const dot = document.querySelector('.status-dot');
            const text = document.getElementById('statusText');
            if (fps >= 50) {
                dot.style.background = '#00f2ff';
                dot.style.boxShadow = '0 0 10px #00f2ff';
                text.innerText = 'Excellent';
            } else if (fps >= 30) {
                dot.style.background = '#ffae00';
                dot.style.boxShadow = '0 0 10px #ffae00';
                text.innerText = 'Good';
            } else {
                dot.style.background = '#ff0055';
                dot.style.boxShadow = '0 0 10px #ff0055';
                text.innerText = 'Low FPS';
            }
        }, 2000);
    </script>
