<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRUDIA 互动抽奖演示</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #4a148c 0%, #1a237e 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 50px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .menu {
            display: flex;
            gap: 30px;
        }

        .menu-item {
            width: 250px;
            height: 350px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .menu-item:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .desc {
            font-size: 0.9rem;
            opacity: 0.8;
            text-align: center;
            padding: 0 20px;
        }

        .tag {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #FFC107;
            color: #333;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>FRUDIA 互动抽奖方案演示</h1>

    <div class="menu">
        <a href="tarot.html" class="menu-item">
            <div class="tag">方案二</div>
            <div class="icon">🎴</div>
            <div class="title">命运塔罗</div>
            <div class="desc">3D 翻牌特效，神秘感十足，必中惊喜。</div>
        </a>

        <a href="blast.html" class="menu-item">
            <div class="tag">方案三</div>
            <div class="icon">💥</div>
            <div class="title">果酱爆破</div>
            <div class="desc">解压点击破碎效果，寻找隐藏的甜蜜。</div>
        </a>
    </div>

</body>
</html>
