<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRUDIA 互动体验</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #4a148c 0%, #1a237e 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            margin: 50px 0;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .menu {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }

        .menu-item {
            width: 250px;
            height: 350px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .menu-item:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .desc {
            font-size: 0.9rem;
            opacity: 0.8;
            text-align: center;
            padding: 0 20px;
            line-height: 1.4;
        }

        .tag {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #FFC107;
            color: #333;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        
        .tag.new {
            background: #FF4081;
            color: white;
        }
    </style>
</head>
<body>

    <h1>✨ FRUDIA 互动体验馆 ✨</h1>

    <div class="menu">
        <a href="tarot.html" class="menu-item">
            <div class="tag new">推荐</div>
            <div class="icon">🔮</div>
            <div class="title">命运炼金术</div>
            <div class="desc">神秘的塔罗翻牌仪式，三次递进，合成最终大奖。</div>
        </a>

        <a href="graffiti.html" class="menu-item">
            <div class="tag new">新品</div>
            <div class="icon">🖌️</div>
            <div class="title">蜂蜜刷墙</div>
            <div class="desc">用手指涂别旧墙，刷出金色新家，焕新惊喜等着你。</div>
        </a>

        <a href="blast.html" class="menu-item">
            <div class="tag">经典</div>
            <div class="icon">💥</div>
            <div class="title">果酱爆破</div>
            <div class="desc">解压点击破碎效果，寻找隐藏的甜蜜。</div>
        </a>
    </div>

</body>
</html>
