<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRUDIA 命运炼金术</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0f0c29;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            color: white;
        }

        /* 动态星空背景 */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        h1 {
            position: relative;
            z-index: 10;
            margin-bottom: 20px;
            font-size: 2rem;
            text-align: center;
            background: linear-gradient(to right, #b388ff, #ffd54f);
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(179, 136, 255, 0.3);
            transition: all 0.5s;
        }

        .status-bar {
            position: relative;
            z-index: 10;
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .slot {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px dashed rgba(255,255,255,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.2);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 24px;
        }

        .slot.active {
            border-style: solid;
            transform: scale(1.2);
            box-shadow: 0 0 20px currentColor;
        }

        .card-container {
            position: relative;
            z-index: 10;
            display: flex;
            gap: 15px;
            perspective: 1200px;
            justify-content: center;
            height: 320px; /* 固定高度防止抖动 */
        }

        .card {
            width: 180px;
            height: 280px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-15px) rotateX(5deg);
        }

        .card.flipped {
            transform: rotateY(180deg);
            cursor: default;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            background: #1a1a2e;
        }

        /* 背面设计 */
        .card-front {
            border: 2px solid rgba(255, 215, 0, 0.3);
            background: radial-gradient(circle at center, #2e2e4d 0%, #161629 100%);
        }

        .card-front::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%239C92AC' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .mystery-symbol {
            font-size: 60px;
            opacity: 0.5;
            animation: breathe 3s infinite ease-in-out;
        }

        /* 正面内容 */
        .card-back {
            transform: rotateY(180deg);
            background: #fff;
            border: 4px solid;
        }

        .card-back.type-1 { border-color: #7B1FA2; background: linear-gradient(135deg, #f3e5f5 0%, #fff 100%); }
        .card-back.type-2 { border-color: #FFB300; background: linear-gradient(135deg, #fff8e1 0%, #fff 100%); }
        .card-back.type-3 { border-color: #E65100; background: linear-gradient(135deg, #fff3e0 0%, #fff 100%); }

        .item-name {
            margin-top: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
        }

        .item-desc {
            font-size: 0.8rem;
            color: #666;
            margin-top: 5px;
        }

        /* 最终大奖展示区 */
        #grand-prize-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s;
        }

        #grand-prize-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .grand-jar {
            width: 350px;
            height: 350px;
            filter: drop-shadow(0 0 50px rgba(255, 193, 7, 0.6));
            animation: grandAppear 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform: scale(0);
        }

        @keyframes breathe { 0%, 100% { opacity: 0.3; transform: scale(0.9); } 50% { opacity: 0.8; transform: scale(1.1); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes grandAppear { 0% { transform: scale(0) rotate(-30deg); } 100% { transform: scale(1) rotate(0deg); } }

        .btn-cta {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 1.2rem;
            background: linear-gradient(45deg, #FFC107, #FF9800);
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 160, 0, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 160, 0, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(255, 160, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 160, 0, 0); } }
        
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            z-index: 200;
        }
        .back-btn:hover { color: white; }

    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← 返回首页</a>
    <canvas id="bg-canvas"></canvas>

    <h1 id="main-title">请抽取第一张命运卡牌</h1>

    <div class="status-bar">
        <div class="slot" id="slot-1" style="color: #7B1FA2; border-color: #7B1FA2;">1</div>
        <div class="slot" id="slot-2" style="color: #FFB300; border-color: #FFB300;">2</div>
        <div class="slot" id="slot-3" style="color: #E65100; border-color: #E65100;">3</div>
    </div>

    <div class="card-container">
        <!-- 生成5张卡牌 -->
        <div class="card" onclick="flipCard(this)">
            <div class="card-face card-front"><div class="mystery-symbol">?</div></div>
            <div class="card-face card-back"></div>
        </div>
        <div class="card" onclick="flipCard(this)">
            <div class="card-face card-front"><div class="mystery-symbol">?</div></div>
            <div class="card-face card-back"></div>
        </div>
        <div class="card" onclick="flipCard(this)">
            <div class="card-face card-front"><div class="mystery-symbol">?</div></div>
            <div class="card-face card-back"></div>
        </div>
        <div class="card" onclick="flipCard(this)">
            <div class="card-face card-front"><div class="mystery-symbol">?</div></div>
            <div class="card-face card-back"></div>
        </div>
        <div class="card" onclick="flipCard(this)">
            <div class="card-face card-front"><div class="mystery-symbol">?</div></div>
            <div class="card-face card-back"></div>
        </div>
    </div>

    <!-- 最终大奖层 -->
    <div id="grand-prize-overlay">
        <h1 style="color: #FFD54F; font-size: 3rem;">✨ 命中注定 ✨</h1>
        
        <!-- 这是一个高度定制的 SVG，模拟高级质感 -->
        <svg class="grand-jar" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 瓶身蜂蜜渐变 -->
                <radialGradient id="honeyBody" cx="40%" cy="40%" r="60%" fx="30%" fy="30%">
                    <stop offset="0%" style="stop-color:#FFECB3; stop-opacity:0.95" />
                    <stop offset="50%" style="stop-color:#FFC107; stop-opacity:0.9" />
                    <stop offset="100%" style="stop-color:#FF6F00; stop-opacity:1" />
                </radialGradient>
                <!-- 盖子流体渐变 -->
                <linearGradient id="lidGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#4A148C;stop-opacity:1" />
                </linearGradient>
                <!-- 高光滤镜 -->
                <filter id="glowFilter">
                    <feGaussianBlur stdDeviation="2" result="blur" />
                    <feSpecularLighting in="blur" surfaceScale="5" specularConstant=".75" specularExponent="20" lighting-color="#ffffff" result="specOut">
                        <fePointLight x="-5000" y="-10000" z="20000" />
                    </feSpecularLighting>
                    <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut" />
                    <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litPaint" />
                </filter>
                 <filter id="shadowFilter">
                    <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
                </filter>
            </defs>

            <!-- 底部阴影 -->
            <ellipse cx="100" cy="170" rx="70" ry="15" fill="rgba(0,0,0,0.3)" filter="url(#blur)" />

            <!-- 瓶身主体 -->
            <path d="M40,90 Q35,150 100,160 Q165,150 160,90 L155,80 L45,80 Z" fill="url(#honeyBody)" filter="url(#glowFilter)" />
            
            <!-- 瓶内高光反光，模拟玻璃感 -->
            <path d="M55,95 Q50,140 90,145" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round" />
            <circle cx="140" cy="110" r="3" fill="rgba(255,255,255,0.6)" />

            <!-- 溢出的果酱盖子 -->
            <!-- 复杂的波浪形底部，模拟流下来的果酱 -->
            <path d="M35,85 
                     C35,60 60,40 100,40 
                     C140,40 165,60 165,85
                     L165,90 
                     Q150,100 135,90 
                     Q120,80 100,95 
                     Q80,110 65,90 
                     Q50,80 35,90 Z" 
                  fill="url(#lidGradient)" filter="url(#shadowFilter)" />

            <!-- 盖子上的高光 -->
            <ellipse cx="70" cy="60" rx="20" ry="8" fill="rgba(255,255,255,0.2)" transform="rotate(-20 70 60)" />

            <!-- LOGO -->
            <text x="100" y="130" font-family="Arial" font-weight="bold" font-size="18" text-anchor="middle" fill="#4A148C" letter-spacing="1">FRUDIA</text>
            <text x="100" y="145" font-family="Arial" font-size="8" text-anchor="middle" fill="#E65100">BLUEBERRY & HONEY</text>
        </svg>

        <p style="font-size: 1.2rem; margin-top: 20px; opacity: 0.8;">蓝莓与蜂蜜的完美邂逅</p>
        <button class="btn-cta" onclick="location.reload()">再抽一次</button>
    </div>

    <script>
        // 游戏状态
        let currentStep = 0; // 0, 1, 2
        const titles = [
            "请抽取第一张：寻找核心原料",
            "请抽取第二张：注入甜蜜能量",
            "最后一张：见证奇迹时刻"
        ];

        // 配置三种卡牌的内容 (SVG)
        const cardsContent = [
            // 1. 蓝莓
            {
                type: 'type-1',
                color: '#7B1FA2',
                name: '神秘蓝莓精粹',
                desc: '萃取自济州岛的新鲜蓝莓',
                svg: `<svg viewBox="0 0 100 100" width="80" height="80"><circle cx="50" cy="50" r="40" fill="#7B1FA2"/><circle cx="35" cy="40" r="10" fill="#BA68C8"/><circle cx="65" cy="60" r="8" fill="#9C27B0"/></svg>`
            },
            // 2. 蜂蜜
            {
                type: 'type-2',
                color: '#FFB300',
                name: '皇家蜂王浆',
                desc: '浓缩的滋润修护力量',
                svg: `<svg viewBox="0 0 100 100" width="80" height="80"><path d="M50 10 L90 30 L90 70 L50 90 L10 70 L10 30 Z" fill="#FFC107"/><path d="M50 20 L80 35 L80 65 L50 80 L20 65 L20 35 Z" fill="#FFD54F"/></svg>`
            },
            // 3. 最终大奖 (卡牌上显示的缩略版)
            {
                type: 'type-3',
                color: '#E65100',
                name: 'FRUDIA 蜜罐',
                desc: '点击查看详情',
                svg: `<svg viewBox="0 0 100 100" width="80" height="80"><circle cx="50" cy="50" r="45" fill="#FF6F00" opacity="0.2"/><text x="50" y="60" font-size="40" text-anchor="middle">🎁</text></svg>`
            }
        ];

        function flipCard(card) {
            if (card.classList.contains('flipped') || currentStep > 2) return;

            // 1. 翻牌动画
            card.classList.add('flipped');
            
            // 2. 获取当前步骤对应的卡牌内容
            const content = cardsContent[currentStep];
            const backFace = card.querySelector('.card-back');
            
            // 动态填充卡牌内容
            backFace.classList.add(content.type);
            backFace.innerHTML = `
                ${content.svg}
                <div class="item-name" style="color:${content.color}">${content.name}</div>
                <div class="item-desc">${content.desc}</div>
            `;

            // 3. 更新状态栏和标题
            document.getElementById(`slot-${currentStep + 1}`).classList.add('active');
            document.getElementById(`slot-${currentStep + 1}`).style.backgroundColor = content.color;
            document.getElementById(`slot-${currentStep + 1}`).style.color = 'white';
            
            // 4. 粒子特效
            createParticles(card, content.color);

            currentStep++;

            // 5. 逻辑分支
            if (currentStep < 3) {
                // 还有下一步
                document.getElementById('main-title').innerText = titles[currentStep];
            } else {
                // 第三步完成，触发大奖
                setTimeout(() => {
                    triggerGrandPrize();
                }, 800);
            }
        }

        function triggerGrandPrize() {
            // 隐藏所有背景卡牌
            const cards = document.querySelectorAll('.card');
            cards.forEach(c => {
                c.style.transition = 'all 0.5s';
                c.style.opacity = '0';
                c.style.transform = 'scale(0)';
            });

            // 显示大奖层
            document.getElementById('grand-prize-overlay').classList.add('show');
            
            // 爆炸粒子
            for(let i=0; i<5; i++) {
                setTimeout(() => {
                    createExplosion(window.innerWidth/2, window.innerHeight/2);
                }, i * 200);
            }
        }

        // --- 粒子系统 ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function createParticles(element, color) {
            const rect = element.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1,
                    color: color,
                    size: Math.random() * 5 + 2
                });
            }
        }

        function createExplosion(x, y) {
             for (let i = 0; i < 100; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 0.5) * 20,
                    life: 1,
                    color: Math.random() > 0.5 ? '#FFC107' : '#7B1FA2',
                    size: Math.random() * 8 + 2
                });
            }
        }

        // 背景浮动粒子
        let bgParticles = [];
        for(let i=0; i<50; i++) {
            bgParticles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 2,
                vy: -Math.random() * 1
            })
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制背景星尘
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            bgParticles.forEach(p => {
                p.y += p.vy;
                if(p.y < 0) p.y = canvas.height;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                ctx.fill();
            });

            // 绘制特效粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                p.vy += 0.1; // 重力

                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                if (p.life <= 0) particles.splice(i, 1);
            }
            ctx.globalAlpha = 1;

            requestAnimationFrame(animate);
        }
        animate();

    </script>
</body>
</html>
