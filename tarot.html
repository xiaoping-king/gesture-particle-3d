<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRUDIA 命运塔罗 - 必中抽奖</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #2a0e38 0%, #000000 100%);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            color: white;
        }

        h1 {
            margin-bottom: 40px;
            text-shadow: 0 0 20px #ffd700;
            font-size: 2.5rem;
            letter-spacing: 2px;
            opacity: 0;
            animation: fadeIn 1s forwards;
        }

        .card-container {
            display: flex;
            gap: 20px;
            perspective: 1000px;
            padding: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            width: 180px;
            height: 260px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            opacity: 0;
            animation: dealCards 0.5s forwards;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(255, 215, 0, 0.3);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* 卡牌背面 (未翻开) */
        .card-front {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 2px solid #ffd700;
        }

        .card-front::after {
            content: "?";
            font-size: 80px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* 卡牌图案装饰 */
        .pattern {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(#ffd700 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.1;
        }

        /* 卡牌正面 (中奖) */
        .card-back {
            background: white;
            transform: rotateY(180deg);
            border: 4px solid #FFC107;
            flex-direction: column;
        }

        /* 结果文字 */
        .result-text {
            position: absolute;
            bottom: 10%;
            font-size: 1.5rem;
            color: #ffd700;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .result-text.show {
            opacity: 1;
        }

        /* 粒子特效层 */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* 动画定义 */
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes dealCards {
            from { 
                opacity: 0; 
                transform: translateY(100px) rotateX(20deg);
            }
            to { 
                opacity: 1; 
                transform: translateY(0) rotateX(0);
            }
        }

        /* 图片占位符 */
        .prize-img {
            width: 80%;
            height: auto;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2));
        }
        
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 0.9rem;
            z-index: 100;
        }
        .back-btn:hover { color: white; }

    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← 返回首页</a>
    <canvas id="particle-canvas"></canvas>

    <h1>✨ 抽取你的今日幸运 ✨</h1>

    <div class="card-container">
        <!-- 5张卡牌 -->
        <div class="card" onclick="reveal(this, 0)">
            <div class="card-face card-front"><div class="pattern"></div></div>
            <div class="card-face card-back">
                <!-- 使用SVG内联图片代替外部图片，保证开箱即用 -->
                <svg class="prize-img" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
                            <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
                        </filter>
                    </defs>
                    <path d="M20,45 Q20,85 50,95 Q80,85 80,45 L80,40 L20,40 Z" fill="#FFC107" />
                    <path d="M15,40 Q50,30 85,40 L85,25 Q50,15 15,25 Z" fill="#673AB7" filter="url(#glow)" />
                    <ellipse cx="50" cy="25" rx="35" ry="10" fill="#9575CD" />
                    <text x="50" y="75" font-size="10" text-anchor="middle" fill="#E65100" font-weight="bold">FRUDIA</text>
                    <text x="50" y="85" font-size="6" text-anchor="middle" fill="#E65100">Honey & Blueberry</text>
                </svg>
                <div style="color: #673AB7; font-weight: bold; margin-top: 10px;">恭喜中奖!</div>
            </div>
        </div>
        <!-- 复制4份 -->
        <div class="card" onclick="reveal(this, 1)">
            <div class="card-face card-front"><div class="pattern"></div></div>
            <div class="card-face card-back">
                <svg class="prize-img" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20,45 Q20,85 50,95 Q80,85 80,45 L80,40 L20,40 Z" fill="#FFC107" />
                    <path d="M15,40 Q50,30 85,40 L85,25 Q50,15 15,25 Z" fill="#673AB7" />
                    <ellipse cx="50" cy="25" rx="35" ry="10" fill="#9575CD" />
                    <text x="50" y="75" font-size="10" text-anchor="middle" fill="#E65100" font-weight="bold">FRUDIA</text>
                    <text x="50" y="85" font-size="6" text-anchor="middle" fill="#E65100">Honey & Blueberry</text>
                </svg>
                <div style="color: #673AB7; font-weight: bold; margin-top: 10px;">恭喜中奖!</div>
            </div>
        </div>
        <div class="card" onclick="reveal(this, 2)">
            <div class="card-face card-front"><div class="pattern"></div></div>
            <div class="card-face card-back">
                <svg class="prize-img" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20,45 Q20,85 50,95 Q80,85 80,45 L80,40 L20,40 Z" fill="#FFC107" />
                    <path d="M15,40 Q50,30 85,40 L85,25 Q50,15 15,25 Z" fill="#673AB7" />
                    <ellipse cx="50" cy="25" rx="35" ry="10" fill="#9575CD" />
                    <text x="50" y="75" font-size="10" text-anchor="middle" fill="#E65100" font-weight="bold">FRUDIA</text>
                    <text x="50" y="85" font-size="6" text-anchor="middle" fill="#E65100">Honey & Blueberry</text>
                </svg>
                <div style="color: #673AB7; font-weight: bold; margin-top: 10px;">恭喜中奖!</div>
            </div>
        </div>
        <div class="card" onclick="reveal(this, 3)">
            <div class="card-face card-front"><div class="pattern"></div></div>
            <div class="card-face card-back">
                <svg class="prize-img" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20,45 Q20,85 50,95 Q80,85 80,45 L80,40 L20,40 Z" fill="#FFC107" />
                    <path d="M15,40 Q50,30 85,40 L85,25 Q50,15 15,25 Z" fill="#673AB7" />
                    <ellipse cx="50" cy="25" rx="35" ry="10" fill="#9575CD" />
                    <text x="50" y="75" font-size="10" text-anchor="middle" fill="#E65100" font-weight="bold">FRUDIA</text>
                    <text x="50" y="85" font-size="6" text-anchor="middle" fill="#E65100">Honey & Blueberry</text>
                </svg>
                <div style="color: #673AB7; font-weight: bold; margin-top: 10px;">恭喜中奖!</div>
            </div>
        </div>
        <div class="card" onclick="reveal(this, 4)">
            <div class="card-face card-front"><div class="pattern"></div></div>
            <div class="card-face card-back">
                <svg class="prize-img" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20,45 Q20,85 50,95 Q80,85 80,45 L80,40 L20,40 Z" fill="#FFC107" />
                    <path d="M15,40 Q50,30 85,40 L85,25 Q50,15 15,25 Z" fill="#673AB7" />
                    <ellipse cx="50" cy="25" rx="35" ry="10" fill="#9575CD" />
                    <text x="50" y="75" font-size="10" text-anchor="middle" fill="#E65100" font-weight="bold">FRUDIA</text>
                    <text x="50" y="85" font-size="6" text-anchor="middle" fill="#E65100">Honey & Blueberry</text>
                </svg>
                <div style="color: #673AB7; font-weight: bold; margin-top: 10px;">恭喜中奖!</div>
            </div>
        </div>
    </div>

    <div class="result-text" id="result-text">命中注定，就是 FRUDIA！</div>

    <script>
        let hasRevealed = false;
        const cards = document.querySelectorAll('.card');
        const resultText = document.getElementById('result-text');

        // 为每张卡牌设置随机延迟入场
        cards.forEach((card, index) => {
            card.style.animationDelay = `${index * 0.1}s`;
        });

        function reveal(clickedCard, index) {
            if (hasRevealed) return;
            hasRevealed = true;

            // 1. 翻转点击的卡牌
            clickedCard.classList.add('flipped');
            fireworks(clickedCard.getBoundingClientRect());

            // 2. 更改标题
            document.querySelector('h1').innerText = "🎉 恭喜中奖！ 🎉";

            // 3. 延迟翻转其他所有卡牌
            setTimeout(() => {
                cards.forEach((card, i) => {
                    if (i !== index) {
                        setTimeout(() => {
                            card.classList.add('flipped');
                        }, i * 100); // 依次翻开
                    }
                });
                
                // 显示底部文字
                resultText.classList.add('show');
            }, 800);
        }

        // 简单的粒子爆炸效果
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function fireworks(rect) {
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;
            
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    life: 1,
                    color: Math.random() > 0.5 ? '#FFC107' : '#673AB7'
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                p.vy += 0.2; // gravity

                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                ctx.fill();

                if (p.life <= 0) particles.splice(i, 1);
            });

            requestAnimationFrame(animate);
        }
        animate();

    </script>
</body>
</html>
